spring.application.name=appals

# Enable the H2 web console in your browser
spring.h2.console.enabled=true

# Use a file-based H2 database so data persists when you restart the app 
# (Use "jdbc:h2:mem:testdb" if you prefer it purely in-memory and wiped on restart)
spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# Auto-generate schema using Hibernate and show SQL queries in the console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true